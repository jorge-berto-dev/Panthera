[Greeter]
background=/usr/share/backgrounds/panthera/wallpaper.png
theme-name=Arc-Dark
icon-theme-name=Panthera
font-name=Inter 11
show-hostname=true
# SVG nao renderiza no slick-greeter: o hook 0200 gera wallpaper.png 1920x1080.
# theme-name=Arc-Dark e o tema que o pacote slick-greeter traz; Panthera aqui
# apontaria para /usr/share/themes/Panthera/slick/ que nao existe.
