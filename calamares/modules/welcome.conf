# calamares/modules/welcome.conf - T1 Bem-vindo (ODT Secao 11 texto literal)
# Tela: Ola! Vamos instalar rapidinho. Leve, privado e seu em ~15 min.
# Mostra RAM e disco. RAM <1.5GB: aviso amarelo "devagar" sem bloquear.
# Botoes: INSTALAR AGORA (gigante azul) | Experimentar | Notas.
# Nada e apagado ate a tela Disco.
requirements:
  - checked: true
    required: true
    name: "Espaco em disco: precisa 12GB (recomendado 20GB)"
  - checked: true
    required: false
    name: "Memoria: 2GB ou mais voa (com 1.5GB fica devagar, sem bloquear)"
  - checked: true
    required: false
    name: "Energia: ligado na tomada (notebook com bateria fraca bloqueia na tela Disco)"
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
