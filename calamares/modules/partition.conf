# calamares/modules/partition.conf - T3 Disco (ODT Secao 11 texto literal + 25.2)
# A) Apagar tudo (recomendado): mostra o disco, avisa que tudo sera apagado.
# B) Lado a lado: slider, minimo 15GB p/ Panthera; avisa se Windows ficar sem 10GB.
# C) Manual: para quem sabe particionar.
# Criptografar (notebook): senha com medidor. UEFI GPT: /boot/efi 512 fat32 boot esp,
# / ext4 (min 12GB, recom 20GB), swapfile 1GB so se RAM<4GB swappiness 10, LUKS2 sem LVM.
# BIOS MBR: bios_grub 1MB + / ext4. Erros: sem disco=reconecte; BitLocker vermelho=
# desative no Windows; bateria<20% sem tomada=bloqueia; EFI<100MB=recria 512 fat32.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
ensureSuspendToDisk: false
initialSwapChoice: reuse
defaultFileSystemType: ext4
