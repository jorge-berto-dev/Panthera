# calamares/modules/users.conf - T4 Quem e voce (ODT Secao 11 texto literal + 25.2)
# Nome, nome do PC (auto), usuario (minusculas, sem espaco, sem root/admin),
# senha min 8 com letra+numero + confirmar com medidor, foto opcional,
# login automatico OFF. Anote a senha: sem ela nao entra nem recupera LUKS.
defaultGroups: [audio, video, network, plugdev, lpadmin, scanner, bluetooth]
autologinGroup: autologin
requireStrongPasswords: true
setRootPassword: false
