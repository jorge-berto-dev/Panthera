# /etc/udisks2/mount_options.conf - pendrive seguro I7 (ODT Secao 6 I7 + Secao 9)
# Ao plugar: monta /media com noexec,nodev,nosuid (sem autoexec de .exe).
# Prova no Live: plugue um pendrive, rode `mount | grep media`.
# Esperado: noexec,nodev,nosuid. Ejetar seguro pelo Thunar.
[defaults]
defaults=noexec,nodev,nosuid
